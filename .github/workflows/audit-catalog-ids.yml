name: Audit catalog IDs

on:
  push:
    branches:
      - audit/catalog-id-collision

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write duplicate catalog ID report
        run: |
          mkdir -p audit
          node --input-type=module <<'NODE' > audit/catalog-id-collision.json
          import { MEGA_ITEMS, MEGA_BOSSES, generateExpandedCards } from './src/data/megaCollectionsData.js';
          const rows = [
            ...generateExpandedCards().map((row) => ({ ...row, _source: 'character' })),
            ...(MEGA_ITEMS || []).map((row) => ({ ...row, _source: 'item' })),
            ...(MEGA_BOSSES || []).map((row) => ({ ...row, _source: 'boss' })),
          ];
          const byId = new Map();
          for (const row of rows) {
            const id = String(row.id ?? row.card_id ?? row.item_id ?? row.boss_id ?? '').trim();
            if (!id) continue;
            const list = byId.get(id) || [];
            list.push({ source: row._source, name: row.name ?? row.title ?? null, collection: row.collection_id ?? row.collection_code ?? row.collectionCode ?? row.collection ?? null });
            byId.set(id, list);
          }
          const duplicates = [...byId.entries()].filter(([, list]) => list.length > 1).map(([id, list]) => ({ id, list }));
          console.log(JSON.stringify({ attemptedRows: rows.length, uniqueIds: byId.size, duplicates }, null, 2));
          NODE
      - name: Commit report and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/catalog-id-collision.json
          git rm .github/workflows/audit-catalog-ids.yml
          git commit -m "chore(audit): persist catalog ID collision report"
          git push origin HEAD:${GITHUB_REF_NAME}
