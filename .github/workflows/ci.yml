name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # package-lock.json in the current repository predates the Firebase/media
      # dependency additions. Vercel already resolves the same dependency graph
      # successfully. Use npm install here until the canonical lockfile is
      # regenerated and committed in a dedicated dependency-maintenance change.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Full repository certification
        run: npm run ci
