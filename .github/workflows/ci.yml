name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # package-lock.json in the current repository predates the Firebase/media
      # dependency additions. Vercel already resolves the same dependency graph
      # successfully. Use npm install here until the canonical lockfile is
      # regenerated and committed in a dedicated dependency-maintenance change.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # Repository certification uses deterministic local persistence/mocks.
      # Production builds do not receive this variable and therefore default to
      # Firebase whenever firebase-applet-config.json is configured.
      - name: Full repository certification
        env:
          VITE_DECKVERSE_STORAGE_MODE: local
        run: npm run ci
