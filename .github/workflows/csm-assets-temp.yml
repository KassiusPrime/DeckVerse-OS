name: Build Isolated CSM 81-Image Preview

on:
  push:
    branches:
      - automation/csm-assets-20260901

permissions:
  contents: read

jobs:
  build-csm-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet pillow requests

      - name: Build isolated 81-image preview ZIP
        run: python .automation/build_csm_preview.py

      - name: Verify preview ZIP
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          r=json.loads(Path('CSM_81_assets_preview_report.json').read_text())
          assert r['mapped_assets'] == 81
          assert r['downloaded_assets'] == 81
          assert r['failure_count'] == 0
          with zipfile.ZipFile('CSM_81_assets_preview.zip') as z:
              names=z.namelist()
              assert z.testzip() is None
              assert len(names) == 81
              assert len(names) == len(set(names))
              assert all(n.startswith('CSM_') and n.endswith('.jpg') for n in names)
              print('Preview ZIP contains exactly 81 isolated JPG assets.')
          PY

      - name: Upload preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: csm-81-assets-preview
          path: |
            CSM_81_assets_preview.zip
            CSM_81_assets_preview_report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csm-81-assets-preview-diagnostics
          path: CSM_81_assets_preview_report.json
          if-no-files-found: ignore
          retention-days: 1
