name: Fix accessibility and OAuth routing

on:
  push:
    branches:
      - fix/accessibility-oauth-routing

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply accessibility fixes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const replaceRequired = (file, from, to) => {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(from)) throw new Error(`Pattern not found in ${file}: ${from.slice(0, 100)}`);
            fs.writeFileSync(file, source.replace(from, to));
          };

          // WCAG AA margin: primary was effectively on the 4.5:1 boundary.
          for (const token of ['--primary', '--ring', '--chart-1', '--sidebar-primary', '--sidebar-ring']) {
            replaceRequired('index.css', `${token}: 252 100% 68%;`, `${token}: 252 100% 72%;`);
          }

          // Brand subtitle should remain readable even at 8–10 px.
          replaceRequired('DeckVerseLogo.jsx', 'uppercase tracking-[0.2em] text-muted-foreground', 'uppercase tracking-[0.2em] text-foreground/80');

          // Public catalog selects.
          replaceRequired('Catalog.jsx', '<select value={collectionFilter}', '<select aria-label="Filtrar por coleção" value={collectionFilter}');
          replaceRequired('Catalog.jsx', '<select value={rarity}', '<select aria-label="Filtrar por raridade" value={rarity}');
          replaceRequired('Catalog.jsx', '<select value={sort}', '<select aria-label="Ordenar catálogo" value={sort}');
          replaceRequired('FormsCatalog.jsx', '<select value={collectionFilter}', '<select aria-label="Filtrar formas por coleção" value={collectionFilter}');
          replaceRequired('MyCollection.jsx', '<select value={type}', '<select aria-label="Filtrar acervo por tipo" value={type}');
          replaceRequired('MyCollection.jsx', '<select value={rarity}', '<select aria-label="Filtrar acervo por raridade" value={rarity}');
          replaceRequired('AdminSupabase.jsx', '<select value={currency}', '<select aria-label="Moeda do ajuste econômico" value={currency}');

          // Search controls: explicit names are more robust than placeholder-only naming.
          replaceRequired('Home.jsx', '<input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Busque personagem, boss, item ou universo"', '<input aria-label="Buscar no DeckVerse" value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Busque personagem, boss, item ou universo"');
          replaceRequired('Catalog.jsx', '<input value={query} onChange={(event) => setQuery(event.target.value)} placeholder={`Pesquisar ${TYPE_CONFIG[type].label.toLowerCase()}...`}', '<input aria-label={`Pesquisar ${TYPE_CONFIG[type].label.toLowerCase()}`} value={query} onChange={(event) => setQuery(event.target.value)} placeholder={`Pesquisar ${TYPE_CONFIG[type].label.toLowerCase()}...`}');
          replaceRequired('FormsCatalog.jsx', '<input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar forma ou personagem..."', '<input aria-label="Buscar forma ou personagem" value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar forma ou personagem..."');
          replaceRequired('MyCollection.jsx', '<input value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Buscar por nome ou coleção..."', '<input aria-label="Buscar no meu acervo" value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Buscar por nome ou coleção..."');
          replaceRequired('CollectionsHub.jsx', '<input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar coleção..."', '<input aria-label="Buscar coleção" value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar coleção..."');
          replaceRequired('CollectionsHub.jsx', '<input value={detailQuery} onChange={(event) => setDetailQuery(event.target.value)} placeholder={`Buscar em ${getName(selectedCollection)}...`}', '<input aria-label={`Buscar em ${getName(selectedCollection)}`} value={detailQuery} onChange={(event) => setDetailQuery(event.target.value)} placeholder={`Buscar em ${getName(selectedCollection)}...`}');

          // Navbar has the same search field in desktop and mobile markup.
          {
            const file = 'Navbar.jsx';
            const source = fs.readFileSync(file, 'utf8');
            const needle = '<input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar personagem, forma ou item"';
            const count = source.split(needle).length - 1;
            if (count !== 2) throw new Error(`Expected 2 Navbar search inputs, found ${count}`);
            fs.writeFileSync(file, source.split(needle).join('<input aria-label="Buscar personagem, forma ou item" value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Buscar personagem, forma ou item"'));
          }
          NODE

      - name: Add permanent accessibility certification
        run: |
          cat > scripts/testAccessibility.mjs <<'NODE'
          import fs from 'node:fs';

          const activeFiles = [
            'Home.jsx', 'Navbar.jsx', 'Catalog.jsx', 'CollectionsHub.jsx', 'FormsCatalog.jsx',
            'MyCollection.jsx', 'Profile.jsx', 'Login.jsx', 'AuthCallback.jsx', 'Support.jsx',
            'Gacha.jsx', 'AdminSupabase.jsx', 'CardDetail.jsx', 'CommandPalette.jsx', 'BottomNav.jsx'
          ];

          const failures = [];
          for (const file of activeFiles) {
            if (!fs.existsSync(file)) continue;
            const source = fs.readFileSync(file, 'utf8');
            const selects = source.match(/<select\b[^>]*>/g) || [];
            selects.forEach((tag, index) => {
              if (!/aria-label=|aria-labelledby=/.test(tag)) failures.push(`${file}: select ${index + 1} lacks an accessible name`);
            });
          }

          const css = fs.readFileSync('index.css', 'utf8');
          if (!css.includes('--primary: 252 100% 72%;')) failures.push('Primary token does not include the WCAG contrast margin');

          const logo = fs.readFileSync('DeckVerseLogo.jsx', 'utf8');
          if (!logo.includes('uppercase tracking-[0.2em] text-foreground/80')) failures.push('DeckVerse tagline contrast regression');

          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const routes = Array.isArray(vercel.routes) ? vercel.routes : [];
          if (!routes.some((route) => route.handle === 'filesystem')) failures.push('vercel.json must preserve filesystem/API routes before SPA fallback');
          if (!routes.some((route) => route.dest === '/index.html')) failures.push('vercel.json must preserve SPA fallback for /auth/callback and client routes');

          const app = fs.readFileSync('App.jsx', 'utf8');
          if (!app.includes('path="/auth/callback"')) failures.push('OAuth callback route missing');

          if (failures.length) {
            console.error('Accessibility/OAuth routing certification failed:\n- ' + failures.join('\n- '));
            process.exit(1);
          }
          console.log('Accessibility/OAuth routing certification: OK');
          NODE

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const command = 'node scripts/testAccessibility.mjs';
          if (!pkg.scripts.test.includes(command)) pkg.scripts.test += ` && ${command}`;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Verify repository
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run test
          npm run lint
          npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-accessibility-oauth-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Home.jsx Navbar.jsx Catalog.jsx CollectionsHub.jsx FormsCatalog.jsx MyCollection.jsx AdminSupabase.jsx DeckVerseLogo.jsx index.css scripts/testAccessibility.mjs package.json .github/workflows/fix-accessibility-oauth-routing.yml
          git commit -m 'fix(ui): resolve accessibility audit findings'
          git push
