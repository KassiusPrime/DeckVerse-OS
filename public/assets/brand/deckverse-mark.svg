    <circle cx="512" cy="512" r="142" fill="none" stroke="#9b43ff" stroke-width="8" opacity=".9"/>
    <circle cx="512" cy="512" r="118" fill="none" stroke="#4925d7" stroke-width="5" opacity=".8"/>
  </g>
