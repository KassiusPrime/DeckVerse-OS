    <path d="M512 214v170M512 640v170M214 512h170M640 512h170" stroke-width="14"/>
    <path d="M386 420 328 362M638 420l58-58M386 604l-58 58M638 604l58 58" stroke-width="14"/>
    <circle cx="512" cy="318" r="18" stroke-width="12"/>
    <circle cx="512" cy="706" r="18" stroke-width="12"/>
