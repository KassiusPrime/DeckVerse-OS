<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DeckVerse OS</title>
  <desc id="desc">Símbolo tecnológico em forma de carta com circuitos ciano, núcleo violeta e hexágono central.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#111b33"/>
      <stop offset=".42" stop-color="#15113d"/>
      <stop offset=".7" stop-color="#6627ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7d31ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65fbff"/>
      <stop offset=".48" stop-color="#12e9f2"/>
      <stop offset="1" stop-color="#00bcca"/>
    </linearGradient>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="violetGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
